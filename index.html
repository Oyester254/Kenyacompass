<!doctype html>
<html lang="en">
  <head>
    <!-- Basic settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO title -->
    <title>Kenya Compass | Discover Kenya's Best Destinations</title>

    <!-- SEO description -->
    <meta
      name="description"
      content="Explore Kenya's top travel destinations, wildlife, beaches, national parks, culture, hotels, and unforgettable adventures with Kenya Compass."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Kenya travel, Kenya tourism, safari, Maasai Mara, Diani Beach, Mount Kenya, Nairobi, travel guide, Kenya Compass"
    />

    <!-- Author -->
    <meta name="author" content="Kenya Compass" />

    <!-- Allow search engines -->
    <meta name="robots" content="index, follow" />

    <!-- Social sharing (Open Graph) -->
    <meta property="og:title" content="Kenya Compass" />
    <meta
      property="og:description"
      content="Explore Kenya's most amazing destinations, travel guides, wildlife, beaches, and adventure."
    />

    <meta property="og:url" content="https://kenyacompass.vercel.app/" />
    <meta
      property="og:image"
      content="https://kenyacompass.vercel.app/preview.jpg"
    />

    <!-- Twitter/X sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kenya Compass" />

      name="twitter:description"
      content="Discover Kenya's most beautiful travel destinations."
    />
    <meta
      name="twitter:image"
      content="https://kenyacompass.vercel.app/preview.jpg"
    />

    <!-- Your favicon -->
